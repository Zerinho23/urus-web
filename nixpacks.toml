[phases.setup]
  nixPkgs = ["nodejs_20"]

  [phases.install]
  cmds = [
    "npx --yes pnpm@9 install --prod=false --no-frozen-lockfile"
  ]

  [phases.build]
  cmds = [
    "npx --yes pnpm@9 --filter @workspace/api-server run build"
  ]

  [start]
  cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
  